[package]
name = "chgk_rating"
version = "0.1.0"
edition = "2021"
description = "Client for rating.chgk.info: the public read API and the admin website's write-side flows (login sessions, player/team creation, roster and results upload)"
license = "MIT"
repository = "https://github.com/EgorKulikov/chgk-rating"
readme = "README.md"
keywords = ["chgk", "rating", "client"]
categories = ["api-bindings"]

[dependencies]
reqwest = { version = "0.12", features = ["json", "cookies", "multipart"] }
reqwest_cookie_store = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
